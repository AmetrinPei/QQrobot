[project]
name = "qqbot"
version = "0.1.0"
description = "NoneBot2 + NapCat + SiliconFlow"
requires-python = ">=3.9"
dependencies = [
    "nonebot2[fastapi]>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "httpx",
    "websockets",
    "openai",
]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = []
plugin_dirs = ["src/plugins"]
builtin_plugins = ["echo"]
